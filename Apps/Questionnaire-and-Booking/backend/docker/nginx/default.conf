
# Thames Valley Estates frontend
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Tokenized routes resolve to the HTML pages
    location ~ ^/questionnaire(/.*)?$ {
        try_files $uri $uri/ /questionnaire/index.html;
    }
    location ~ ^/booking(/.*)?$ {
        try_files $uri $uri/ /booking/index.html;
    }

    # The frontend is static in this container; Vercel app API handlers are
    # deployed separately from the booking/ and questionnaire/ project roots.
    location /booking/api/ { return 404; }
    location /questionnaire/api/ { return 404; }

    # Backend API (replaces n8n webhooks - same paths preserved)
    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Static caching
    location ~ ^/(booking|questionnaire)/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
